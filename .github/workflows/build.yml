name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # actions/checkout@v4 / actions/upload-artifact@v4 / actions/download-artifact@v4 都跑在
  # Node 20 上,GitHub 2026-09-16 會把 Node 20 從 runner 移除。提前 opt-in Node 24,免得
  # 屆時靜默炸掉;也順便消掉每次 build 都跳的 deprecation annotation。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: mori-ear-linux-x86_64
          - name: windows-x86_64
            os: windows-latest
            artifact: mori-ear-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libx11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/mori-ear-linux-x86_64.tar.gz -C target/release mori-ear

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item scripts/install-autostart.ps1,scripts/remove-autostart.ps1 -Destination target/release/
          Compress-Archive -Path target/release/mori-ear.exe,target/release/install-autostart.ps1,target/release/remove-autostart.ps1 -DestinationPath dist/mori-ear-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
