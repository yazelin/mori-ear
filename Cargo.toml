[package]
name = "mori-ear"
version = "0.2.2"
edition = "2021"
description = "Mori 的耳朵 — 極簡 CLI:全域熱鍵 → 錄音 → STT → stdout"
license = "MIT OR Apache-2.0"

[dependencies]
# audio capture
cpal = "0.15"
# WAV encoding (Groq Whisper 收 wav/mp3/flac 等,wav 最簡)
hound = "3.5"
# Groq Whisper API
reqwest = { version = "0.12", features = ["multipart", "rustls-tls", "json"], default-features = false }
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
# global hotkey(MVP:Linux X11 + Windows;Wayland 之後加 ashpd)
global-hotkey = "0.6"
# 對外轉譯服務的 HTTP server(GET / 驗活、POST /inference)。blocking、極小依賴,
# 符合 ear 的極簡調性(不引 axum/hyper)。每 request 在 service thread 用 tokio Handle
# block_on 跑 async 轉譯。
tiny_http = "0.12"
# paste-back:type 進焦點視窗。enigo 跨 Linux X11 / Windows / macOS,Unicode OK
enigo = "0.5"
# 單一實例 lock(Linux 用 abstract socket、Windows 用 named mutex、macOS lock file)
# 避免兩個 mori-ear 同時 grab 同一把熱鍵(X11 一個 client 一把 key)
single-instance = "0.3"
# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# error + log
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# parking_lot for low-overhead mutex(audio callback path)
parking_lot = "0.12"

# Linux-only:close fd 3..N 在 spawn child 前(pre_exec hook)。
# 為什麼:`single-instance` crate 創 abstract Unix socket 時沒設 FD_CLOEXEC,
# `xclip` 寫完 fork 為 daemon 持有 X11 selection、會繼承那個 socket fd,
# 即使 mori-ear 被 kill,xclip 還在持 socket → 新 instance 啟動 SingleInstance::is_single()
# 永遠 false。修法:spawn xclip/xdotool 前 close fd >= 3,擋掉 FD 洩漏。
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
futures-util = { version = "0.3.33", default-features = false }
libc = "0.2"

# Windows-only:跟 mori-desktop 同一套,paste-back 改走 Win32 clipboard + SendInput Ctrl+V
# (比 enigo text() 逐字 SCANCODE_UNICODE 快很多,長段落瞬間貼上)。
#   - Win32_Foundation: HWND / HANDLE / CloseHandle
#   - Win32_UI_Input_KeyboardAndMouse: SendInput / VK_CONTROL / VK_V 注入 Ctrl+V
#   - Win32_UI_WindowsAndMessaging: GetForegroundWindow / GetWindowThreadProcessId
#   - Win32_System_Threading: OpenProcess / QueryFullProcessImageNameW(取焦點視窗 process name → 偵測 terminal)
#   - Win32_System_DataExchange: OpenClipboard / SetClipboardData / EmptyClipboard / CloseClipboard
#   - Win32_System_Memory: GlobalAlloc / GlobalLock / GlobalUnlock(clipboard buffer 必經)
#   - Win32_System_Ole: CF_UNICODETEXT 常數
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # AttachConsole(ATTACH_PARENT_PROCESS) — release build 設了 windows_subsystem = "windows",
    # 從 terminal 跑時靠這個重新接回父 console 印 log;autostart 沒父 console,自然 no-op
    "Win32_System_Console",
] }

# tiny_http 同時供測試用(本地 whisper-server fallback 的 stub server,對齊 AgentOS 證法);
# 已在 [dependencies] 宣告,測試自然取用,毋須在 dev-dependencies 重複。

[profile.release]
opt-level = "z"
lto = true
strip = true
